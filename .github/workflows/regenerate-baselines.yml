name: Regenerar baselines de calidad

# MANUAL: Actions → "Regenerar baselines de calidad" → Run workflow.
#
# CUÁNDO: SOLO tras un cambio puramente ESTRUCTURAL (mover o partir código, como los cortes de EditorScreen.kt de la Fase 3).
# El baseline de ktlint identifica cada infracción por archivo + línea + regla; mover código desplaza las líneas y las infracciones
# ya conocidas parecen "nuevas". Regenerar el baseline las vuelve a congelar tal como están. NO lo uses para tapar infracciones
# reales introducidas en el mismo cambio: la SALVAGUARDA de abajo falla si el baseline CRECE (una refactorización pura no añade
# infracciones). Si crece y lo aceptas a conciencia, relanza con allow_growth = true.
#
# QUÉ HACE: regenera ktlint-baseline.xml y app/lint-baseline.xml, los publica como un commit en main y lanza el CI principal
# (los commits hechos con GITHUB_TOKEN no disparan otros workflows por sí solos; por eso se invoca explícitamente).
# Ver docs/QUALITY_GATES.md §5.

on:
  workflow_dispatch:
    inputs:
      allow_growth:
        description: "Permitir que el baseline tenga MÁS hallazgos que el actual (solo si aceptas deuda nueva a conciencia)"
        type: boolean
        default: false

permissions:
  contents: write   # publicar el commit con los baselines
  actions: write    # lanzar el CI principal después

concurrency:
  group: regenerate-baselines
  cancel-in-progress: false

jobs:
  regenerate:
    # Solo en main: nunca se escribe un baseline en una rama de trabajo.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v6

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
          cache-read-only: false

      # Misma preparación que el CI principal (Lint necesita SDK/NDK para configurar el proyecto).
      - name: Configurar Android SDK y NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK_ROOT/platforms/android-36" ] \
             && [ -d "$SDK_ROOT/build-tools/36.0.0" ] \
             && [ -d "$SDK_ROOT/ndk/28.2.13676358" ] \
             && [ -d "$SDK_ROOT/platform-tools" ]; then
            echo "Android SDK 36 y NDK r28c ya preinstalados en el runner. Se omite la instalación."
            exit 0
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager bajo '$SDK_ROOT/cmdline-tools'."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Regenerar baseline de ktlint
        shell: bash
        run: |
          set -euo pipefail
          # La versión sale del CI principal: una sola fuente de verdad, sin deriva entre ambos workflows.
          KTLINT_VERSION="$(grep -oP 'KTLINT_VERSION: "\K[0-9.]+' .github/workflows/android-build.yml | head -n1)"
          test -n "$KTLINT_VERSION"
          curl -sSfL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"
          before=0
          if [ -f ktlint-baseline.xml ]; then before="$(grep -c '<error ' ktlint-baseline.xml || true)"; fi
          rm -f ktlint-baseline.xml
          globs=(--relative "app/src/**/*.kt" "buildSrc/src/**/*.kt" "!**/build/**")
          "$RUNNER_TEMP/ktlint" --baseline=ktlint-baseline.xml --reporter=plain-summary "${globs[@]}" || true
          after=0
          if [ -f ktlint-baseline.xml ]; then after="$(grep -c '<error ' ktlint-baseline.xml || true)"; fi
          echo "KTLINT_BEFORE=$before" >> "$GITHUB_ENV"
          echo "KTLINT_AFTER=$after" >> "$GITHUB_ENV"
          echo "ktlint (ktlint $KTLINT_VERSION): $before -> $after hallazgos"

      - name: Regenerar baseline de Android Lint
        shell: bash
        run: |
          set -euo pipefail
          before=0
          if [ -f app/lint-baseline.xml ]; then before="$(grep -c '<issue ' app/lint-baseline.xml || true)"; fi
          rm -f app/lint-baseline.xml
          gradle lintDebug --stacktrace -Polyze.lintGenerateBaseline=true -Dlint.baselines.continue=true
          after=0
          if [ -f app/lint-baseline.xml ]; then after="$(grep -c '<issue ' app/lint-baseline.xml || true)"; fi
          echo "LINT_BEFORE=$before" >> "$GITHUB_ENV"
          echo "LINT_AFTER=$after" >> "$GITHUB_ENV"
          echo "lint: $before -> $after problemas"

      # SALVAGUARDA: una refactorización pura no añade hallazgos. Si crecen, hay infracciones REALES nuevas: se corrigen, no se congelan.
      - name: Salvaguarda (el baseline no puede crecer)
        shell: bash
        env:
          ALLOW_GROWTH: ${{ inputs.allow_growth }}
        run: |
          set -euo pipefail
          grew=0
          if [ "$KTLINT_AFTER" -gt "$KTLINT_BEFORE" ]; then echo "::warning::ktlint: $KTLINT_BEFORE -> $KTLINT_AFTER (crece)"; grew=1; fi
          if [ "$LINT_AFTER" -gt "$LINT_BEFORE" ]; then echo "::warning::lint: $LINT_BEFORE -> $LINT_AFTER (crece)"; grew=1; fi
          if [ "$grew" -eq 1 ] && [ "$ALLOW_GROWTH" != "true" ]; then
            echo "::error::El baseline CRECE: hay hallazgos nuevos que no vienen de mover código. Corrígelos, o relanza con allow_growth = true si los aceptas a conciencia."
            exit 1
          fi
          echo "OK: el baseline no crece (ktlint $KTLINT_BEFORE -> $KTLINT_AFTER, lint $LINT_BEFORE -> $LINT_AFTER)."

      - name: Publicar baselines y lanzar el CI principal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ktlint-baseline.xml app/lint-baseline.xml
          if git diff --cached --quiet; then
            echo "Los baselines ya estaban al día: no hay nada que publicar."
            exit 0
          fi
          git commit -m "chore(calidad): regenerar baselines de ktlint y lint tras refactorización estructural"
          git push
          gh workflow run android-build.yml --ref main
