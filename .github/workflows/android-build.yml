name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Si se empuja dos veces seguidas a la misma rama antes de que termine el
# build anterior, ahora se ENCOLA el nuevo en vez de matar el viejo.
#
# Antes esto era cancel-in-progress: true — parecía inofensivo ("total,
# ese build viejo ya no sirve") pero causó justo el bug intermitente del
# "Premature end of file" en recursos random (ic_add.xml, etc.): con
# org.gradle.caching=true, Gradle escribe cada resultado de tarea
# (incluida packageDebugResources) al build cache dentro de
# ~/.gradle/caches, y gradle/actions/setup-gradle sube ese directorio
# completo a la caché de GitHub Actions al terminar. Si un push nuevo
# llegaba MIENTRAS esa escritura estaba a mitad de camino, GitHub Actions
# mataba el runner ahí mismo — dejando una entrada de caché a medio
# escribir (un archivo de 0 bytes) guardada como si fuera válida. La
# corrida siguiente la reusaba, encontraba el recurso vacío, y el build
# tronaba con SAXParseException aunque el código fuente nunca tuvo nada
# raro. Encolar en vez de cancelar elimina esa ventana de corte a media
# escritura.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # El repo no trae comiteado el binario del Gradle Wrapper
      # (gradle-wrapper.jar) — solo gradle-wrapper.properties, que fija la
      # versión (8.6). Esta action instala esa versión exacta directo en
      # el runner, cachea las distribuciones/dependencias entre corridas,
      # y deja el comando `gradle` listo para usar sin depender de
      # ./gradlew.
      - name: Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # BUG REAL de terceros (no de este proyecto), encontrado en la corrida
      # que falló: `android-actions/setup-android@v3` ejecuta internamente
      # `sdkmanager tools` — el paquete LEGACY "Android SDK Tools", que
      # Google descontinuó y retiró de su repositorio de SDK hace años. La
      # action falla con "Warning: Failed to find package 'tools'" seguido
      # de "Error: ... failed with exit code 1", ANTES de que Gradle
      # siquiera arranque — no es un fallo de compilación ni de tests de
      # este proyecto.
      #
      # Corrección real: se deja de depender de esa action de terceros no
      # mantenida, y se usa directo el `sdkmanager` OFICIAL que ya viene
      # preinstalado en el runner `ubuntu-latest` bajo
      # $ANDROID_SDK_ROOT/cmdline-tools/<version>/bin/sdkmanager.
      #
      # SEGUNDO bug real encontrado (primera corrida de este fix):
      # `sdkmanager` NO está en el $PATH de ese shell por defecto (el
      # runner exporta ANDROID_HOME/ANDROID_SDK_ROOT, pero no agrega el
      # binario al PATH) — "sdkmanager: command not found", exit code 127.
      # Corrección real (no un segundo parche encima del primero):
      # resolver la ruta COMPLETA del binario dinámicamente con `find`,
      # tomando la versión más alta instalada de cmdline-tools (`sort -V`)
      # en vez de hardcodear un número de carpeta que puede cambiar entre
      # actualizaciones de la imagen del runner — y fallar con un mensaje
      # explícito si algún día el layout de la imagen cambia por completo,
      # en vez de un "command not found" opaco.
      - name: Configurar Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager bajo '$SDK_ROOT/cmdline-tools' — el runner pudo haber cambiado su layout de Android SDK."
            exit 1
          fi
          echo "Usando sdkmanager en: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Tests unitarios
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      # Con el soporte multiarquitectura (ver build-config/abi/), este
      # directorio ya no tiene un único app-debug.apk — tiene uno por ABI
      # (armeabi-v7a, arm64-v8a) más el universal. Se sube el directorio
      # completo con un patrón en vez de un nombre fijo, así que agregar
      # una arquitectura nueva el día de mañana no rompe este step.
      - name: Subir APKs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: olyze-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Solo se sube si algún paso anterior falló — para poder abrir el
      # reporte HTML de qué test rompió sin tener que reproducirlo local.
      - name: Subir reporte de tests (solo si falló algo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          retention-days: 14
